<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Portfolio{% endblock %} | Archie Abraham</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Custom overrides -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/custom.css') }}"
    />
  </head>
  <body>
    <!-- Sticky header wrapper: contact bar + navbar scroll together -->
    <div class="sticky-top">
      <!-- Contact bar -->
      <div class="bg-primary text-white py-1">
        <div class="container d-flex justify-content-end gap-4">
          <a
            href="tel:+447847416338"
            class="text-white text-decoration-none small"
          >
            <i class="bi bi-telephone-fill me-1"></i>+44 7847 416338
          </a>
          <a
            href="mailto:archiepabraham@gmail.com"
            class="text-white text-decoration-none small"
          >
            <i class="bi bi-envelope-fill me-1"></i>archiepabraham@gmail.com
          </a>
        </div>
      </div>

      <!-- Navbar: light, white background, subtle shadow -->
      <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
          <a class="navbar-brand fw-bold" href="{{ url_for('index') }}"
            >Archie Abraham</a
          >
          <button
            class="navbar-toggler border-0"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-1">
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('index') }}">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('portfolio') }}"
                  >Portfolio</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{ url_for('education') }}"
                  >Education</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>
    <!-- end sticky-top wrapper -->
    <main class="py-5">{% block content %}{% endblock %}</main>

    <!-- Footer -->
    <footer class="bg-light text-muted py-4">
      <div class="container text-center">
        <p class="mb-2">
          <a
            href="https://github.com/ArchieAbr"
            class="text-muted me-3"
            aria-label="GitHub"
          >
            <i class="bi bi-github fs-5"></i>
          </a>
          <a
            href="https://www.linkedin.com/in/archie-abraham-067546252"
            class="text-muted"
            aria-label="LinkedIn"
          >
            <i class="bi bi-linkedin fs-5"></i>
          </a>
        </p>
        <small>&copy; 2026 Archie Abraham</small>
      </div>
    </footer>

    <!-- Bootstrap 5 JS bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVgAFM/jiRVRWAiQXoFVIlmJTK2"
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
