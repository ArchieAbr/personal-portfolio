<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Portfolio{% endblock %} | Your Name</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Custom overrides -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/custom.css') }}"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}"
          >Your Name</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('index') }}">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('portfolio') }}"
                >Portfolio</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('education') }}"
                >Education</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page content -->
    <main class="container my-5">{% block content %}{% endblock %}</main>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-2">
          <a
            href="https://github.com/yourusername"
            class="text-white-50 me-3"
            aria-label="GitHub"
          >
            <i class="bi bi-github fs-5"></i>
          </a>
          <a
            href="https://linkedin.com/in/yourusername"
            class="text-white-50"
            aria-label="LinkedIn"
          >
            <i class="bi bi-linkedin fs-5"></i>
          </a>
        </p>
        <small>&copy; 2026 Your Name</small>
      </div>
    </footer>

    <!-- Bootstrap 5 JS bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVgAFM/jiRVRWAiQXoFVIlmJTK2"
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
